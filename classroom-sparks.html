<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Sparks · 課堂火花</title>
<style>
:root{--green:#075b52;--deep:#06443e;--mint:#e7f3ef;--paper:#f8f5ec;--card:#fffdf8;--line:#ded5c2;--ink:#29261f;--soft:#746d5d;--gold:#d89a25;--gold-soft:#fff2c9;--serif:Georgia,"Noto Serif TC",serif;--sans:Inter,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--deep),var(--green));color:#fff;border-radius:0 0 34px 34px;padding:28px 20px 34px}.hero:after{content:"";position:absolute;width:280px;height:280px;right:-80px;top:-145px;border:1px solid rgba(255,255,255,.2);border-radius:50%;box-shadow:0 0 0 38px rgba(255,255,255,.04),0 0 0 78px rgba(255,255,255,.025)}.hero-inner,.main{max-width:1080px;margin:auto}.back{position:relative;z-index:1;color:#d8eee9;text-decoration:none;font-size:.78rem}.hero-kicker{position:relative;z-index:1;margin-top:20px;color:#f2c969;font-size:.68rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.hero h1{position:relative;z-index:1;font:700 clamp(1.85rem,5vw,3rem)/1.15 var(--serif);margin:5px 0}.hero p{position:relative;z-index:1;max-width:680px;margin:0;color:#d8eee9;font-size:.86rem}.main{padding:25px 18px 80px}.toolbar{display:grid;grid-template-columns:1fr 210px auto;gap:10px;margin-bottom:18px}.toolbar input,.toolbar select{min-height:46px;width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 13px;font:inherit;color:var(--ink)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--green);border-radius:999px;background:var(--green);color:#fff;padding:9px 17px;font:800 .75rem var(--sans);text-decoration:none;cursor:pointer}.btn.ghost{background:transparent;color:var(--green)}.status{margin:0 0 15px;color:var(--soft);font-size:.72rem}.spark-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.spark-card{position:relative;display:flex;flex-direction:column;min-height:235px;padding:18px;border:1px solid var(--line);border-radius:19px;background:var(--card);box-shadow:0 3px 0 rgba(222,213,194,.8);transition:transform .16s ease,box-shadow .16s ease}.spark-card:hover{transform:translateY(-3px);box-shadow:0 9px 22px rgba(43,67,53,.1)}.spark-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.spark-date{font-size:.61rem;color:var(--soft)}.star{border:0;background:transparent;color:#b7ae9d;font-size:1.25rem;line-height:1;cursor:pointer;padding:3px}.star.active{color:var(--gold)}.spark-card h2{font:700 1.1rem/1.35 var(--serif);color:var(--deep);margin:12px 0 7px}.spark-question{margin:0;color:var(--soft);font-size:.76rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}.tag{display:inline-flex;padding:3px 8px;border-radius:999px;background:var(--mint);color:var(--green);font-size:.57rem;font-weight:850}.read-more{margin-top:auto;padding-top:14px;color:var(--green);font-size:.7rem;font-weight:900;text-decoration:none}.empty{grid-column:1/-1;padding:42px 20px;border:1px dashed var(--line);border-radius:19px;background:rgba(255,255,255,.48);text-align:center;color:var(--soft)}.article{max-width:850px;margin:auto}.article[hidden],.library[hidden]{display:none}.article-card{overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 3px 0 var(--line)}.article-head{padding:25px clamp(20px,5vw,46px);background:linear-gradient(145deg,#edf6f2,#fff8e2)}.article-topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.article h1{font:700 clamp(1.55rem,4vw,2.25rem)/1.25 var(--serif);color:var(--deep);margin:15px 0 8px}.article-question{margin:0;color:var(--soft);font-size:.9rem}.article-body{padding:8px clamp(20px,5vw,46px) 35px}.content-block{padding:23px 0;border-bottom:1px solid var(--line)}.content-block:last-child{border:0}.content-label{margin:0 0 9px;color:var(--green);font-size:.63rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.quick-answer{font:700 1.15rem/1.55 var(--serif);color:var(--ink);margin:0}.prose{white-space:pre-wrap;margin:0;font-size:.88rem}.comparison{width:100%;border-collapse:collapse;font-size:.79rem}.comparison th,.comparison td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.comparison th{background:var(--mint);color:var(--deep)}.examples{margin:0;padding-left:22px}.examples li{margin:7px 0}.challenge{padding:17px;border-radius:15px;background:var(--gold-soft);border-left:5px solid var(--gold);white-space:pre-wrap}.article-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}.article-star{gap:7px}.article-star.active{background:var(--gold);border-color:var(--gold);color:#fff}.denied{max-width:580px;margin:70px auto;padding:28px;border:1px solid var(--line);border-radius:20px;background:#fff;text-align:center}.denied[hidden]{display:none}@media(max-width:780px){.spark-grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 170px}.toolbar .btn{grid-column:1/-1}}@media(max-width:520px){.spark-grid,.toolbar{grid-template-columns:1fr}.spark-card{min-height:205px}.hero{border-radius:0 0 24px 24px}.article-body{padding-top:0}}
.article-source{display:inline-block;margin-top:10px;color:var(--green);font-size:.62rem;font-weight:850}.quick-answer{white-space:pre-wrap}.content-link{color:var(--green);font-weight:800;text-decoration-thickness:1.5px;text-underline-offset:3px;overflow-wrap:anywhere}.content-link:hover{color:#9b6811;background:var(--gold-soft)}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><a class="back" href="index.html">← 回課程總覽</a><div class="hero-kicker">Questions worth keeping</div><h1>Classroom Sparks · 課堂火花</h1><p>課堂上偶然遇見的好問題，不讓下課鐘聲帶走。從一句疑問出發，慢慢拓展成可以反覆查閱的英文知識。</p></div></header>
<main class="main" id="main" hidden>
  <section class="library" id="library">
    <div class="toolbar"><input id="searchInput" type="search" placeholder="搜尋標題、問題、內容或關鍵字…" aria-label="搜尋課堂火花"><select id="tagFilter" aria-label="依分類篩選"><option value="">全部分類</option></select><button class="btn ghost" id="refreshBtn" type="button">更新內容</button></div>
    <p class="status" id="status">正在載入符合你的班級內容…</p>
    <div class="spark-grid" id="sparkGrid"></div>
  </section>
  <article class="article" id="article" hidden></article>
</main>
<div class="denied" id="accessMessage"><h2>正在確認學習者身份…</h2><p>登入後就能閱讀屬於你班級的課堂火花。</p></div>

<script src="js/loader.js?v=3"></script>
<script type="module">
import { getPortalProfile, observePortalAuth } from "./js/firebase-auth.js";
import { clearClassroomSparksCache, loadPublishedSparks } from "./js/classroom-sparks-data.js";
import { linkifyText } from "./js/linkify-text.js";

const STAR_KEY="classroomSparkStars",$=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
let sparks=[],profile=null;
const dateText=value=>{if(!value)return"";const date=new Date(value);return Number.isNaN(date.getTime())?"":date.toLocaleDateString("zh-TW",{year:"numeric",month:"short",day:"numeric"})};

function readStars(){
  try{
    const values=JSON.parse(localStorage.getItem(STAR_KEY)||"[]"),map=new Map();
    (Array.isArray(values)?values:[]).forEach(value=>{try{const item=JSON.parse(value);if(item?.id)map.set(item.id,{raw:value,item})}catch(_){}});
    return map;
  }catch(_){return new Map()}
}
function toggleStar(spark){
  const stars=readStars();
  if(stars.has(spark.id))stars.delete(spark.id);
  else{
    const item={id:spark.id,title:spark.title,quickAnswer:spark.quickAnswer,tags:spark.tags||[],updatedAt:spark.updatedAt||spark.publishedAt||""};
    stars.set(spark.id,{raw:JSON.stringify(item),item});
  }
  localStorage.setItem(STAR_KEY,JSON.stringify([...stars.values()].map(value=>value.raw)));
  renderCurrent();
}
function tagsHtml(tags){return(tags||[]).map(tag=>`<span class="tag">${esc(tag)}</span>`).join("")}
function searchText(spark){return[spark.title,spark.question,spark.quickAnswer,spark.explanation,spark.comparison,spark.examples,spark.challenge,...(spark.tags||[])].join(" ").toLocaleLowerCase()}

function renderLibrary(){
  const query=$("searchInput").value.trim().toLocaleLowerCase(),tag=$("tagFilter").value,stars=readStars();
  const filtered=sparks.filter(spark=>(!query||searchText(spark).includes(query))&&(!tag||(spark.tags||[]).includes(tag)));
  $("status").textContent=`共 ${filtered.length} 則課堂火花 · ${profile.school||""} ${profile.className||""}`;
  $("sparkGrid").innerHTML=filtered.length?filtered.map(spark=>`<article class="spark-card"><div class="spark-meta"><span class="spark-date">${esc(dateText(spark.publishedAt||spark.updatedAt))}</span><button class="star ${stars.has(spark.id)?"active":""}" type="button" data-star="${esc(spark.id)}" aria-label="${stars.has(spark.id)?"取消星標":"加入星標"}">★</button></div><h2>${esc(spark.title)}</h2><p class="spark-question">${esc(spark.question||spark.quickAnswer)}</p><div class="tags">${tagsHtml(spark.tags)}</div><a class="read-more" href="classroom-sparks.html?spark=${encodeURIComponent(spark.id)}">閱讀完整內容 →</a></article>`).join(""):'<div class="empty">目前沒有符合條件的課堂火花。</div>';
  $("sparkGrid").querySelectorAll("[data-star]").forEach(button=>button.addEventListener("click",()=>{const spark=sparks.find(item=>item.id===button.dataset.star);if(spark)toggleStar(spark)}));
}

function comparisonHtml(value){
  const rows=String(value||"").split(/\n+/).map(line=>line.split("|").map(cell=>cell.trim())).filter(row=>row.some(Boolean));
  if(!rows.length)return"";
  return `<table class="comparison"><thead><tr><th>Word / Expression</th><th>Meaning</th><th>Usage Note</th></tr></thead><tbody>${rows.map(row=>`<tr><td><strong>${linkifyText(row[0]||"")}</strong></td><td>${linkifyText(row[1]||"")}</td><td>${linkifyText(row.slice(2).join(" | "))}</td></tr>`).join("")}</tbody></table>`;
}
function examplesHtml(value){const lines=String(value||"").split(/\n+/).map(line=>line.trim()).filter(Boolean);return lines.length?`<ol class="examples">${lines.map(line=>`<li>${linkifyText(line)}</li>`).join("")}</ol>`:""}
function block(label,content,className="prose"){return content?`<section class="content-block"><h2 class="content-label">${label}</h2><div class="${className}">${content}</div></section>`:""}

function renderArticle(spark){
  if(!spark){$("article").innerHTML='<div class="empty">找不到這則內容，或它目前沒有對你的班級發布。</div>';return}
  const starred=readStars().has(spark.id);
  document.title=`${spark.title} · Classroom Sparks`;
  $("article").innerHTML=`<div class="article-actions"><a class="btn ghost" href="classroom-sparks.html">← 回全部課堂火花</a><button class="btn article-star ${starred?"active":""}" id="articleStar" type="button">★ ${starred?"已收藏":"加入星標"}</button></div><div class="article-card"><header class="article-head"><div class="article-topline"><span class="spark-date">${esc(dateText(spark.publishedAt||spark.updatedAt))}</span><div class="tags">${tagsHtml(spark.tags)}</div></div><h1>${esc(spark.title)}</h1><p class="article-question">${linkifyText(spark.question)}</p></header><div class="article-body">${block("Short Answer · 快速回答",linkifyText(spark.quickAnswer),"quick-answer")}${block("Deep Dive · 深入說明",linkifyText(spark.explanation))}${block("Compare · 容易混淆的說法",comparisonHtml(spark.comparison),"comparison-wrap")}${block("Examples · 例句",examplesHtml(spark.examples),"examples-wrap")}${block("Try It · 想一想",linkifyText(spark.challenge),"challenge")}</div></div>`;
  if(spark.source){const source=document.createElement("span");source.className="article-source";source.textContent=`From ${spark.source}`;$("article").querySelector(".article-head").appendChild(source)}
  $("articleStar").addEventListener("click",()=>toggleStar(spark));
}

function renderCurrent(){
  const id=new URLSearchParams(location.search).get("spark");
  $("library").hidden=Boolean(id);$("article").hidden=!id;
  if(id)renderArticle(sparks.find(item=>item.id===id));else renderLibrary();
}
function populateTags(){
  const tags=[...new Set(sparks.flatMap(item=>item.tags||[]))].sort((a,b)=>a.localeCompare(b,"zh-TW"));
  $("tagFilter").innerHTML='<option value="">全部分類</option>'+tags.map(tag=>`<option value="${esc(tag)}">${esc(tag)}</option>`).join("");
}
async function load(force=false){
  $("refreshBtn").disabled=true;$("status").textContent="正在整理課堂火花…";
  try{if(force)clearClassroomSparksCache();sparks=await loadPublishedSparks(profile,{force});populateTags();renderCurrent()}
  catch(error){$("status").textContent="內容暫時無法載入，請確認網路或稍後再試。";$("sparkGrid").innerHTML='<div class="empty">課堂火花載入失敗。</div>';console.warn(error)}
  finally{$("refreshBtn").disabled=false}
}

observePortalAuth(async user=>{
  if(!user){location.replace("index.html");return}
  try{profile=await getPortalProfile(user);$("accessMessage").hidden=true;$("main").hidden=false;await load(false)}
  catch(error){$("accessMessage").innerHTML='<h2>無法確認身份</h2><p>請回首頁重新登入。</p>';console.warn(error)}
});
$("searchInput").addEventListener("input",renderLibrary);$("tagFilter").addEventListener("change",renderLibrary);$("refreshBtn").addEventListener("click",()=>load(true));
</script>
</body>
</html>
