<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>尚未上架 · 英文課程補充教材</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .panel {
    max-width: 460px; width: 100%; text-align: center;
    background: var(--card); border: 1px solid var(--paper-line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 40px 32px;
  }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 18px;
    border: 1px solid var(--paper-line); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 1.6rem; font-weight: 700; background: var(--accent-soft);
  }
  h1 { font-family: var(--serif); font-size: 1.4rem; margin: 0 0 8px; }
  .lesson-tag {
    display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft); margin-bottom: 14px;
  }
  p.msg { font-size: 0.92rem; line-height: 1.7; color: var(--ink-soft); margin: 0 0 24px; }
  a.back {
    display: inline-block; font-family: var(--sans); font-size: 0.85rem; font-weight: 700;
    text-decoration: none; border: 1px solid var(--paper-line); border-radius: 999px;
    padding: 10px 22px; color: var(--ink); transition: background .12s ease, border-color .12s ease;
  }
  a.back:hover { background: var(--accent-soft); border-color: var(--accent); }
</style>
</head>
<body>
  <div class="panel">
    <div class="mark">📖</div>
    <div class="lesson-tag" id="lessonTag">課程</div>
    <h1>這一課還在製作中</h1>
    <p class="msg">補充內容尚未上架，之後會陸續補上單字、片語、文法與課文結構的線上互動版本。</p>
    <a class="back" href="index.html">← 回到課程總覽</a>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const book = (params.get("book") || "").toUpperCase();
  const lesson = (params.get("lesson") || "").toUpperCase();
  if (book && lesson) {
    document.getElementById("lessonTag").textContent = `${book} ${lesson}`;
  } else {
    document.getElementById("lessonTag").style.display = "none";
  }
</script>
<script src="js/loader.js"></script>
</body>
</html>
