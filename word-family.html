<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Family · 課程補充內容</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .wf-head { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff; padding: 30px 20px 26px; border-radius: 0 0 28px 28px; }
  .wf-head .inner { max-width: 1000px; margin: 0 auto; }
  .wf-head h1 { font-family: var(--serif); font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .wf-head .sub { font-size: 0.85rem; color: rgba(255,255,255,.82); }
  .wf-head .back { color: rgba(255,255,255,.82); text-decoration: none; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }

  .wf-stat {
    display: inline-flex; align-items: baseline; gap: 6px; margin-top: 12px;
    padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.14);
    font-size: 0.8rem; color: rgba(255,255,255,.92);
  }
</style>
</head>
<body>

  <div class="wf-head">
    <div class="inner">
      <div class="breadcrumb">
        <a class="back" href="index.html">← 課程總覽</a>
        &nbsp;/&nbsp;
        <a class="back" id="lessonBackLink" href="lesson.html">← 回課程頁</a>
      </div>
      <h1 id="pageTitle" style="margin-top:8px;">Word Family</h1>
      <div class="sub">點字族標籤切換，再點單字看例句、中文意思與發音</div>
      <div class="wf-stat" id="wordCount">—</div>
    </div>
  </div>

  <div class="wrap">
    <div class="loading-msg" id="loadingMsg">單字資料載入中…</div>

    <div id="explorerArea" style="display:none;">
      <nav class="family-rail" id="familyRail" aria-label="選擇字族"></nav>

      <div class="family-heading">
        <div>
          <p class="breadcrumb" style="margin-bottom:2px;">CURRENT FAMILY</p>
          <h2 id="familyName">—</h2>
        </div>
        <p id="familyProgress">—</p>
      </div>

      <div class="pos-grid" id="posGrid"></div>

      <div class="detail-panel" id="detailPanel">
        <div class="detail-head">
          <span class="detail-word">—</span>
          <span class="pos-tag">—</span>
          <span class="detail-source" style="display:none;"></span>
          <button class="speak-btn" title="播放發音">🔊 發音</button>
        </div>
        <div class="detail-zh">—</div>
        <div class="detail-example">
          <span class="lbl">Example</span>
          <span class="detail-example-text">—</span>
        </div>
      </div>
    </div>
  </div>

<script src="js/loader.js"></script>
<script src="js/vocab-widget.js"></script>
<script>
  const bookId = Loader.getUrlParam("book", "b1");
  const lessonId = Loader.getUrlParam("lesson", "l1");

  document.getElementById("lessonBackLink").href = `lesson.html?book=${bookId}&lesson=${lessonId}`;

  Loader.fetchLessonData(bookId, lessonId)
    .then(data => {
      document.getElementById("loadingMsg").style.display = "none";

      document.title = `Word Family · ${data.book} ${data.lesson} ${data.title || ""}`;
      document.getElementById("pageTitle").textContent =
        `Word Family — ${data.book} ${data.lesson}${data.title ? ": " + data.title : ""}`;

      const rows = data.vocabulary?.rows || [];
      if (!rows.length) {
        document.getElementById("loadingMsg").className = "empty-state";
        document.getElementById("loadingMsg").style.display = "block";
        document.getElementById("loadingMsg").textContent = "這一課的單字家族尚未建立。";
        return;
      }

      document.getElementById("explorerArea").style.display = "block";
      VocabWidget.render({
        railId: "familyRail",
        nameId: "familyName",
        progressId: "familyProgress",
        gridId: "posGrid",
        panelId: "detailPanel",
        countId: "wordCount",
        rows: rows
      });
    })
    .catch(err => {
      document.getElementById("loadingMsg").className = "error-msg";
      document.getElementById("loadingMsg").textContent =
        "資料載入失敗：" + err.message + "（請確認此頁面透過本機伺服器或 GitHub Pages 開啟）";
    });
</script>
</body>
</html>
