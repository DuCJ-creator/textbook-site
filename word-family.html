<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Family · 課程補充內容</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .wf-head { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff; padding: 30px 20px 26px; border-radius: 0 0 28px 28px; }
  .wf-head .inner { max-width: 1000px; margin: 0 auto; }
  .wf-head h1 { font-family: var(--serif); font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .wf-head .sub { font-size: 0.85rem; color: rgba(255,255,255,.82); }
  .wf-head .back { color: rgba(255,255,255,.82); text-decoration: none; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }

  .wf-stat {
    display: inline-flex; align-items: baseline; gap: 6px; margin-top: 12px;
    padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.14);
    font-size: 0.8rem; color: rgba(255,255,255,.92);
  }
</style>
</head>
<body>

  <div class="wf-head">
    <div class="inner">
      <div class="breadcrumb">
        <a class="back" href="index.html">← 課程總覽</a>
        &nbsp;/&nbsp;
        <a class="back" id="lessonBackLink" href="lesson.html">← 回課程頁</a>
      </div>
      <h1 id="pageTitle" style="margin-top:8px;">Word Family</h1>
      <div class="sub">點字族標籤切換，再點單字看例句、中文意思與發音</div>
      <div class="wf-stat" id="wordCount">—</div>
    </div>
  </div>

  <div class="wrap">
    <div class="loading-msg" id="loadingMsg">單字資料載入中…</div>

    <div id="explorerWrap" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
        <div class="mode-toggle vocab-mode-switch">
          <button id="familyModeBtn" class="active">探索字族</button>
          <button id="tableModeBtn">完整表格</button>
        </div>
        <a class="btn primary" id="practiceLink" href="#">🎮 拼寫／聽寫練習</a>
      </div>

      <div id="explorerArea">
        <nav class="family-rail" id="familyRail" aria-label="選擇字族"></nav>

        <div class="family-heading">
          <div>
            <p class="breadcrumb" style="margin-bottom:2px;">CURRENT FAMILY</p>
            <h2 id="familyName">—</h2>
          </div>
          <p id="familyProgress">—</p>
        </div>

        <div class="pos-grid" id="posGrid"></div>
      </div>

      <div id="tableArea" style="display:none;">
        <div class="vocab-table-scroll">
          <table class="vocab-table">
            <thead>
              <tr>
                <th style="width:26%">Verb 動詞</th>
                <th style="width:26%">Noun 名詞</th>
                <th style="width:26%">Adjective 形容詞</th>
                <th style="width:22%">Adverb 副詞</th>
              </tr>
            </thead>
            <tbody id="vocabTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="detail-panel" id="detailPanel">
        <div class="detail-head">
          <span class="detail-word">—</span>
          <span class="pos-tag">—</span>
          <span class="detail-source" style="display:none;"></span>
          <button class="speak-btn" title="播放發音">🔊 發音</button>
        </div>
        <div class="detail-zh">—</div>
        <div class="detail-example">
          <span class="lbl">Example</span>
          <span class="detail-example-text">—</span>
        </div>
      </div>
    </div>
  </div>

<script src="js/loader.js"></script>
<script src="js/vocab-widget.js"></script>
<script>
  const bookId = Loader.getUrlParam("book", "b1");
  const lessonId = Loader.getUrlParam("lesson", "l1");

  document.getElementById("lessonBackLink").href = `lesson.html?book=${bookId}&lesson=${lessonId}`;
  document.getElementById("practiceLink").href = `word-practice.html?book=${bookId}&lesson=${lessonId}`;

  let CURRENT_ROWS = [];

  Loader.fetchLessonData(bookId, lessonId)
    .then(data => {
      document.getElementById("loadingMsg").style.display = "none";

      document.title = `Word Family · ${data.book} ${data.lesson} ${data.title || ""}`;
      document.getElementById("pageTitle").textContent =
        `Word Family — ${data.book} ${data.lesson}${data.title ? ": " + data.title : ""}`;

      const rows = data.vocabulary?.rows || [];
      CURRENT_ROWS = rows;
      if (!rows.length) {
        document.getElementById("loadingMsg").className = "empty-state";
        document.getElementById("loadingMsg").style.display = "block";
        document.getElementById("loadingMsg").textContent = "這一課的單字家族尚未建立。";
        return;
      }

      document.getElementById("explorerWrap").style.display = "block";
      VocabWidget.render({
        railId: "familyRail",
        nameId: "familyName",
        progressId: "familyProgress",
        gridId: "posGrid",
        panelId: "detailPanel",
        countId: "wordCount",
        rows: rows
      });

      document.getElementById("familyModeBtn").addEventListener("click", () => setVocabMode("family"));
      document.getElementById("tableModeBtn").addEventListener("click", () => setVocabMode("table"));
    })
    .catch(err => {
      document.getElementById("loadingMsg").className = "error-msg";
      document.getElementById("loadingMsg").textContent =
        "資料載入失敗：" + err.message + "（請確認此頁面透過本機伺服器或 GitHub Pages 開啟）";
    });

  let tableRendered = false;

  function setVocabMode(mode) {
    document.getElementById("familyModeBtn").classList.toggle("active", mode === "family");
    document.getElementById("tableModeBtn").classList.toggle("active", mode === "table");
    document.getElementById("explorerArea").style.display = mode === "family" ? "block" : "none";
    document.getElementById("tableArea").style.display = mode === "table" ? "block" : "none";

    if (mode === "table" && !tableRendered) {
      // 表格只在第一次切換過去時渲染，之後重複切換不用重新產生 DOM
      VocabWidget.renderTable({
        tableBodyId: "vocabTableBody",
        panelId: "detailPanel",
        rows: CURRENT_ROWS
      });
      tableRendered = true;
    }
  }
</script>
<script src="js/notepad.js"></script>
<script>Notepad.mount();</script>
</body>
</html>
