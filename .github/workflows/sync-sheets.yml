name: Sync course data from Google Sheets

# 觸發時機：
#   1. schedule：每 30 分鐘自動跑一次（cron 是 UTC 時間，"*/30 * * * *" 代表每 30 分鐘）
#   2. workflow_dispatch：允許你在 GitHub 網頁上手動點「Run workflow」立即跑一次，
#      不用等排程，適合你剛改完 Sheets、想馬上看到網站更新的情況
#   3. push 到 main 且改到 scripts/ 底下的檔案：確保你以後修改同步腳本本身，
#      也會立刻驗證腳本還能正常運作
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/sync_from_sheets.py"

# 讓這個 workflow 有權限把變更 commit 回 repo
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        run: python3 scripts/sync_from_sheets.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 只有 data/ 底下真的有變動才 commit，避免每次排程都產生空 commit
          if git diff --quiet -- data/; then
            echo "No changes to data/ — nothing to commit."
          else
            git add data/
            git commit -m "chore: sync course data from Google Sheets [automated]"
            git push
          fi
