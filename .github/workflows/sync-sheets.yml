name: Sync course data from Google Sheets

# 觸發時機：
#   1. schedule：每 30 分鐘自動跑一次（cron 是 UTC 時間，"*/30 * * * *" 代表每 30 分鐘）
#   2. workflow_dispatch：允許你在 GitHub 網頁上手動點「Run workflow」立即跑一次，
#      不用等排程，適合你剛改完 Sheets、想馬上看到網站更新的情況
#   3. push 到 main 且改到 scripts/ 底下的檔案：確保你以後修改同步腳本本身，
#      也會立刻驗證腳本還能正常運作
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/sync_from_sheets.py"

# 讓這個 workflow 有權限把變更 commit 回 repo
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        run: python3 scripts/sync_from_sheets.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 用 git status --porcelain 而不是 git diff：
          # git diff 只會比對「已經被 git 追蹤過的檔案」內容有沒有變，
          # 對於全新出現的檔案（例如第一次同步出全新一冊、全新一課的 json）
          # 完全偵測不到，因為那些檔案根本還沒被 git 認得（untracked）。
          # git status --porcelain 同時涵蓋「已追蹤檔案的修改」與「全新未追蹤的檔案」，
          # 這裡 data/ 底下如果有任何新增/修改，輸出就不會是空字串。
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No changes to data/ — nothing to commit."
          else
            git add data/
            git commit -m "chore: sync course data from Google Sheets [automated]"
            git push
          fi
