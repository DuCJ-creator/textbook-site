<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>片語字典索引 · Phrase Index</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .idx-head { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff; padding: 30px 20px 26px; border-radius: 0 0 28px 28px; }
  .idx-head .inner { max-width: 900px; margin: 0 auto; }
  .idx-head h1 { font-family: var(--serif); font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .idx-head .sub { font-size: 0.85rem; color: rgba(255,255,255,.82); }
  .idx-head .back { color: rgba(255,255,255,.82); text-decoration: none; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }

  .idx-toolbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255, 253, 248, .92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--paper-line);
    padding: 12px 20px;
  }
  .idx-toolbar .inner { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .idx-list { display: flex; flex-direction: column; }
  .idx-row {
    position: relative;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 11px 34px 11px 4px; border-bottom: 1px solid var(--paper-line);
    text-decoration: none; color: inherit;
    transition: background .12s ease, padding-left .12s ease;
  }
  .idx-row:hover { background: var(--accent-soft); padding-left: 10px; }
  .idx-row .idx-term { font-family: var(--serif); font-size: 1.02rem; font-weight: 700; flex: 0 0 auto; min-width: 200px; }
  .idx-row .idx-meaning { font-size: 0.86rem; color: var(--ink-soft); flex: 1 1 200px; }
  .idx-row .idx-source {
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.05em; color: var(--accent-dark);
    background: var(--blue-soft); padding: 2px 9px; border-radius: 999px; flex: 0 0 auto;
  }
  .idx-star-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 999px; border: none;
    background: transparent; cursor: pointer; font-size: 1rem;
    color: #d8cfa8; display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease, color .15s ease;
  }
  .idx-star-btn:hover { transform: translateY(-50%) scale(1.15); }
  .idx-star-btn.starred { color: var(--gold); }

  .idx-count { font-size: 0.78rem; color: var(--ink-soft); margin: 14px 4px 8px; }
</style>
</head>
<body>

  <div class="idx-head">
    <div class="inner">
      <a class="back" href="index.html">← 課程總覽</a>
      <h1 style="margin-top:8px;">教材片語索引 Phrase Index</h1>
      <div class="sub">查任何一個片語，點下去直接跳到它所在的課程——不用先知道出自哪一課</div>
    </div>
  </div>

  <div class="idx-toolbar">
    <div class="inner">
      <input type="text" class="search-box" id="idxSearch" placeholder="搜尋片語或中文意思…" style="flex:1 1 240px;" />
      <button type="button" class="btn" id="idxStarredOnlyBtn">☆ 只看已收藏</button>
    </div>
  </div>

  <div class="wrap">
    <div class="loading-msg" id="loadingMsg">整理全部片語中…</div>
    <div class="idx-count" id="idxCount" style="display:none;"></div>
    <div class="idx-list" id="idxList"></div>
  </div>

<script src="js/loader.js"></script>
<script>
  const STAR_KEY = "phraseStarredIds"; // 跟 phrase-widget.js 共用同一個 key，兩邊標星狀態互通
  let ALL_ENTRIES = [];
  let starredIds = Loader.loadStarredSet(STAR_KEY);
  let starredOnly = false;

  Loader.fetchAllPublishedLessons()
    .then(lessons => {
      ALL_ENTRIES = lessons.flatMap(lesson =>
        (lesson.phrases?.items || []).map(item => ({
          id: item.id,
          phrase: item.phrase,
          zh: item.zh || "",
          book: lesson._book,
          lesson: lesson._lesson
        }))
      );

      ALL_ENTRIES.sort((a, b) => a.phrase.localeCompare(b.phrase));

      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("idxCount").style.display = "block";

      if (!ALL_ENTRIES.length) {
        document.getElementById("idxCount").textContent = "目前還沒有已上架課程的片語資料。";
        return;
      }

      document.getElementById("idxSearch").addEventListener("input", renderList);
      document.getElementById("idxStarredOnlyBtn").addEventListener("click", toggleStarredOnly);
      renderList();
    })
    .catch(err => {
      document.getElementById("loadingMsg").className = "error-msg";
      document.getElementById("loadingMsg").textContent =
        "資料載入失敗：" + err.message + "（請確認此頁面透過本機伺服器或 GitHub Pages 開啟）";
    });

  function toggleStarredOnly() {
    starredOnly = !starredOnly;
    const btn = document.getElementById("idxStarredOnlyBtn");
    btn.classList.toggle("active", starredOnly);
    btn.textContent = starredOnly ? "★ 只看已收藏" : "☆ 只看已收藏";
    renderList();
  }

  function toggleStar(id) {
    if (starredIds.has(id)) starredIds.delete(id);
    else starredIds.add(id);
    Loader.saveStarredSet(STAR_KEY, starredIds);
    renderList();
  }

  function renderList() {
    const query = document.getElementById("idxSearch").value.trim().toLowerCase();
    let filtered = ALL_ENTRIES.filter(e => {
      if (!query) return true;
      return e.phrase.toLowerCase().includes(query) || e.zh.includes(query);
    });
    if (starredOnly) filtered = filtered.filter(e => starredIds.has(e.id));

    const parts = [`共 ${filtered.length} 個片語`];
    if (query) parts.push("已篩選");
    if (starredOnly) parts.push("只看收藏");
    document.getElementById("idxCount").textContent = parts.join("・");

    const list = document.getElementById("idxList");
    list.innerHTML = "";

    if (!filtered.length && starredOnly) {
      list.innerHTML = '<p style="color:var(--ink-soft); font-size:.85rem; padding:20px 4px;">還沒有收藏任何片語，點每一列右側的星星即可收藏。</p>';
      return;
    }

    filtered.forEach(e => {
      const isStarred = starredIds.has(e.id);
      const a = document.createElement("a");
      a.className = "idx-row";
      a.href = `lesson.html?book=${e.book}&lesson=${e.lesson}&jumpTo=p2&highlight=${encodeURIComponent(e.id)}`;
      a.innerHTML = `
        <span class="idx-term">${Loader.escapeHtml(e.phrase)}</span>
        <span class="idx-meaning">${Loader.escapeHtml(e.zh)}</span>
        <span class="idx-source">${e.book.toUpperCase()} ${e.lesson.toUpperCase()}</span>
        <button type="button" class="idx-star-btn${isStarred ? " starred" : ""}" aria-label="收藏這個片語" title="收藏">${isStarred ? "★" : "☆"}</button>
      `;
      a.querySelector(".idx-star-btn").addEventListener("click", ev => {
        ev.preventDefault();
        ev.stopPropagation();
        toggleStar(e.id);
      });
      list.appendChild(a);
    });
  }
</script>
<script src="js/notepad.js"></script>
<script>Notepad.mount();</script>
</body>
</html>
