
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>句型總覽 Grammar Bank</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .bank-head { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff; padding: 30px 20px 26px; border-radius: 0 0 28px 28px; }
  .bank-head .inner { max-width: 980px; margin: 0 auto; }
  .bank-head h1 { font-family: var(--serif); font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .bank-head .sub { font-size: 0.85rem; color: rgba(255,255,255,.82); }
  .bank-head .back { color: rgba(255,255,255,.82); text-decoration: none; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }

  .filter-bar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255, 253, 248, .92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--paper-line);
    padding: 12px 20px;
  }
  .filter-bar .inner { max-width: 980px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .filter-bar label { font-size: 0.78rem; font-weight: 700; color: var(--ink-soft); }
  .filter-bar select {
    font-family: var(--sans); font-size: 0.82rem; padding: 8px 12px;
    border: 1px solid var(--paper-line); border-radius: 999px; background: var(--card); color: var(--ink);
  }
  .filter-bar .result-count { font-size: 0.78rem; color: var(--ink-soft); margin-left: auto; }

  .empty-state { padding: 50px 20px; text-align: center; color: var(--ink-soft); font-size: 0.88rem; }

  .type-chooser {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
    margin: 22px 0 24px;
  }
  .type-card {
    position: relative; min-height: 104px; padding: 17px 15px 14px; text-align: left;
    border: 1.5px solid var(--paper-line); border-radius: 16px; background: var(--card);
    color: var(--ink); font-family: var(--sans); cursor: pointer;
    box-shadow: 0 2px 0 var(--paper-line);
    transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease, background .14s ease;
  }
  .type-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 7px 18px -12px rgba(8,75,70,.55); }
  .type-card.active {
    color: var(--accent-dark); border-color: var(--accent); background: var(--blue-soft);
    box-shadow: 0 0 0 3px rgba(14,107,99,.12), 0 2px 0 var(--accent);
  }
  .type-card .type-no {
    display: block; margin-bottom: 9px; color: var(--ink-soft); font-size: .65rem;
    font-weight: 800; letter-spacing: .1em;
  }
  .type-card.active .type-no { color: var(--accent); }
  .type-card .type-name { display: block; font-family: var(--serif); font-size: .96rem; font-weight: 700; line-height: 1.3; }
  .type-card .type-count {
    position: absolute; right: 11px; top: 10px; min-width: 25px; height: 25px; padding: 0 7px;
    display: grid; place-items: center; border-radius: 999px; background: var(--paper-2, #f4ecdd);
    color: var(--ink-soft); font-size: .7rem; font-weight: 800;
  }
  .type-card.active .type-count { color: #fff; background: var(--accent); }

  /* 依句型分類的區塊，跟單課頁「顯示模式」共用相同的兩欄對照視覺語言 */
  .gb-type-group { margin-bottom: 26px; }
  .gb-type-group h3 {
    font-family: var(--serif); font-size: 1.15rem; font-weight: 700; color: var(--accent-dark);
    margin: 0 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--accent-soft);
  }
  .gb-type-table { display: table; width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  .gb-row { display: table-row; }
  .gb-row > .gb-source-cell,
  .gb-row > .gb-text-cell,
  .gb-row > .gb-pattern-cell {
    display: table-cell; vertical-align: middle;
    background: var(--card); border-top: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line);
    padding: 11px 14px;
  }
  .gb-source-cell {
    border-left: 1px solid var(--paper-line); border-radius: 12px 0 0 12px;
    width: 90px; text-align: center; font-family: var(--sans); font-size: 0.68rem; font-weight: 700; color: var(--accent-dark);
    background: var(--blue-soft) !important;
  }
  .gb-text-cell { font-family: var(--serif); font-size: 0.92rem; width: 62%; }
  .gb-pattern-cell {
    border-right: 1px solid var(--paper-line); border-radius: 0 12px 12px 0;
    font-size: 0.72rem; color: var(--ink-soft); font-family: var(--sans); white-space: nowrap; text-align: right;
  }
  .main-verb { color: #c23b3b; font-weight: 800; }

  .practice-launch {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    margin: 0 0 24px; padding: 18px 20px; border: 1.5px solid #d8a332;
    border-radius: 18px; background: linear-gradient(135deg, #fff9e8, #fff3c9);
    box-shadow: 0 3px 0 #ead49b;
  }
  .practice-launch strong { display: block; font-family: var(--serif); font-size: 1.05rem; color: var(--accent-dark); }
  .practice-launch span { display: block; margin-top: 3px; color: var(--ink-soft); font-size: .78rem; }
  .practice-launch button, .practice-action {
    flex: 0 0 auto; border: 0; border-radius: 999px; padding: 11px 18px;
    background: var(--accent); color: #fff; font: 800 .8rem var(--sans); cursor: pointer;
  }
  .practice-shell { max-width: 780px; margin: 22px auto 40px; }
  .practice-card { background: var(--card); border: 1px solid var(--paper-line); border-radius: 22px; padding: clamp(20px,4vw,34px); box-shadow: var(--shadow); }
  .practice-hud { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-soft); font-size: .75rem; font-weight: 800; }
  .practice-quit { border: 0; background: transparent; color: var(--ink-soft); font: 700 .72rem var(--sans); cursor: pointer; text-decoration: underline; }
  .practice-progress { height: 8px; margin: 10px 0 26px; overflow: hidden; border-radius: 999px; background: var(--paper-2,#eee5d5); }
  .practice-progress span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
  .practice-question { font-family: var(--serif); font-size: clamp(1.12rem,3vw,1.55rem); line-height: 1.65; text-align: center; margin: 0 auto 24px; }
  .practice-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .practice-option { min-height: 62px; padding: 12px; border: 1.5px solid var(--paper-line); border-radius: 13px; background: #fff; color: var(--ink); font: 700 .82rem var(--sans); cursor: pointer; }
  .practice-option:hover:not(:disabled) { border-color: var(--accent); background: var(--blue-soft); }
  .practice-option.correct { border-color: #2f8a58; background: #e3f6e9; color: #22663f; }
  .practice-option.wrong { border-color: #c23b3b; background: #fde8e6; color: #8f2929; }
  .practice-feedback { min-height: 48px; margin-top: 15px; padding: 10px 12px; border-radius: 10px; background: var(--blue-soft); text-align: center; font-size: .8rem; color: var(--ink-soft); }
  .practice-result { text-align: center; }
  .practice-result .trophy { font-size: 3rem; }
  .practice-result-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 20px 0; }
  .practice-result-grid div { padding: 15px 8px; border-radius: 14px; background: var(--blue-soft); }
  .practice-result-grid strong { display: block; font: 800 1.6rem var(--serif); color: var(--accent-dark); }
  .practice-result-grid span { font-size: .7rem; color: var(--ink-soft); }
  .practice-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .practice-action.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }

  @media (max-width: 600px) {
    .type-chooser { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 16px; }
    .type-card { min-height: 92px; padding: 14px 12px 12px; }
    .gb-pattern-cell { display: none; }
    .practice-launch { align-items: stretch; flex-direction: column; }
    .practice-options { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="bank-head">
    <div class="inner">
      <a class="back" href="index.html">← 課程總覽</a>
      <h1 style="margin-top:8px;">課文句型分類探索 Sentence Bank (Structure-Classified)</h1>
      <div class="sub">彙整所有已上架課程的句型分類，適合考前總複習</div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="inner">
      <label for="bookFilter">冊次</label>
      <select id="bookFilter"><option value="">全部</option></select>
      <label for="lessonFilter">課程</label>
      <select id="lessonFilter"><option value="">全部</option></select>
      <span class="result-count" id="resultCount"></span>
    </div>
  </div>

  <div class="wrap">
    <div class="loading-msg" id="loadingMsg">彙整所有課程句型中…</div>
    <div class="type-chooser" id="typeChooser" style="display:none;" aria-label="選擇句型分類">
      <button class="type-card active" type="button" data-type="simple" aria-pressed="true">
        <span class="type-no">TYPE 01</span><span class="type-name">Simple<br>Sentence</span><span class="type-count">0</span>
      </button>
      <button class="type-card" type="button" data-type="compound" aria-pressed="false">
        <span class="type-no">TYPE 02</span><span class="type-name">Compound<br>Sentence</span><span class="type-count">0</span>
      </button>
      <button class="type-card" type="button" data-type="complex" aria-pressed="false">
        <span class="type-no">TYPE 03</span><span class="type-name">Complex<br>Sentence</span><span class="type-count">0</span>
      </button>
      <button class="type-card" type="button" data-type="compound-complex" aria-pressed="false">
        <span class="type-no">TYPE 04</span><span class="type-name">Compound-Complex<br>Sentence</span><span class="type-count">0</span>
      </button>
    </div>
    <div class="practice-launch" id="practiceLaunch" style="display:none;">
      <div><strong>🎯 Random 10 · 句型分類挑戰</strong><span>從目前冊次／課程範圍隨機抽題，每答對一題 15 分。</span></div>
      <button id="startPracticeBtn" type="button">開始十句挑戰 →</button>
    </div>
    <div id="sentenceArea" style="display:none;"></div>
    <div id="practiceArea" class="practice-shell" style="display:none;"></div>
  </div>

<script src="js/loader.js"></script>
<script>
  const TYPE_LABELS = {
    simple: "Simple Sentence",
    compound: "Compound Sentence",
    complex: "Complex Sentence",
    "compound-complex": "Compound-Complex Sentence"
  };
  const TYPE_ORDER = ["simple", "compound", "complex", "compound-complex"];

  let ALL_ITEMS = [];
  let LESSON_META = [];
  let ACTIVE_TYPE = "simple";
  let PRACTICE = null;

  Loader.fetchAllPublishedLessons()
    .then(lessons => {
      LESSON_META = lessons.map(l => ({ book: l._book, lesson: l._lesson, title: l.title }));

      ALL_ITEMS = lessons.flatMap(l =>
        (l.grammar?.sentence_structures?.items || []).map(item => ({ ...item, _book: l._book, _lesson: l._lesson }))
      );

      document.getElementById("loadingMsg").style.display = "none";

      if (!ALL_ITEMS.length) {
        document.getElementById("loadingMsg").className = "empty-state";
        document.getElementById("loadingMsg").style.display = "block";
        document.getElementById("loadingMsg").textContent = "目前還沒有已上架課程的句型資料。";
        return;
      }

      document.getElementById("sentenceArea").style.display = "block";
      document.getElementById("typeChooser").style.display = "grid";
      document.getElementById("practiceLaunch").style.display = "flex";
      buildFilters();
      buildTypeChooser();
      document.getElementById("startPracticeBtn").addEventListener("click", startPractice);
      renderFiltered();
    })
    .catch(err => {
      document.getElementById("loadingMsg").className = "error-msg";
      document.getElementById("loadingMsg").textContent = "資料載入失敗：" + err.message + "（請確認此頁面透過本機伺服器或 GitHub Pages 開啟）";
    });

  function buildFilters() {
    const bookSelect = document.getElementById("bookFilter");
    const lessonSelect = document.getElementById("lessonFilter");

    const books = [...new Set(LESSON_META.map(m => m.book))].sort();
    books.forEach(b => {
      const opt = document.createElement("option");
      opt.value = b;
      opt.textContent = b.toUpperCase();
      bookSelect.appendChild(opt);
    });

    bookSelect.addEventListener("change", () => {
      refreshLessonOptions();
      renderFiltered();
    });
    lessonSelect.addEventListener("change", renderFiltered);

    refreshLessonOptions();
  }

  function buildTypeChooser() {
    document.querySelectorAll("#typeChooser .type-card").forEach(card => {
      card.addEventListener("click", () => {
        ACTIVE_TYPE = card.dataset.type;
        document.querySelectorAll("#typeChooser .type-card").forEach(other => {
          const active = other.dataset.type === ACTIVE_TYPE;
          other.classList.toggle("active", active);
          other.setAttribute("aria-pressed", String(active));
        });
        renderFiltered();
      });
    });
  }

  function refreshLessonOptions() {
    const bookVal = document.getElementById("bookFilter").value;
    const lessonSelect = document.getElementById("lessonFilter");
    lessonSelect.innerHTML = '<option value="">全部</option>';

    const lessons = LESSON_META
      .filter(m => !bookVal || m.book === bookVal)
      .sort((a, b) => a.lesson.localeCompare(b.lesson));

    lessons.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.lesson;
      opt.textContent = `${m.lesson.toUpperCase()}${m.title ? " · " + m.title : ""}`;
      lessonSelect.appendChild(opt);
    });
  }

  // 把句子文字裡用 *word* 標記的主動詞轉成紅色粗體，跟單課頁 sentence-sort.js
  // 的 markMainVerb 邏輯一致（這裡獨立實作一份，避免這個純顯示頁面依賴
  // 帶有拖曳練習邏輯的 sentence-sort.js 模組，降低耦合）
  function markMainVerb(sentence) {
    const escaped = Loader.escapeHtml(sentence);
    return escaped.replace(/\*(.+?)\*/g, '<span class="main-verb">$1</span>');
  }

  function renderFiltered() {
    const bookVal = document.getElementById("bookFilter").value;
    const lessonVal = document.getElementById("lessonFilter").value;

    const scopeItems = ALL_ITEMS.filter(item => {
      if (bookVal && item._book !== bookVal) return false;
      if (lessonVal && item._lesson !== lessonVal) return false;
      return true;
    });
    const filtered = scopeItems.filter(item => item.type === ACTIVE_TYPE);

    document.getElementById("resultCount").textContent = `${TYPE_LABELS[ACTIVE_TYPE]} · ${filtered.length} 句`;

    document.querySelectorAll("#typeChooser .type-card").forEach(card => {
      card.querySelector(".type-count").textContent = scopeItems.filter(item => item.type === card.dataset.type).length;
    });

    const area = document.getElementById("sentenceArea");
    area.innerHTML = "";

    const items = filtered;
    if (items.length) {
      const group = document.createElement("div");
      group.className = "gb-type-group";
      group.innerHTML = `
        <h3>${TYPE_LABELS[ACTIVE_TYPE]}</h3>
        <div class="gb-type-table">
          ${items.map(it => `
            <div class="gb-row">
              <span class="gb-source-cell">${it._book.toUpperCase()}-${it._lesson.toUpperCase()}-${Loader.escapeHtml(displayNo(it))}</span>
              <span class="gb-text-cell">${markMainVerb(it.sentence)}</span>
              <span class="gb-pattern-cell">${Loader.escapeHtml(it.pattern)}</span>
            </div>
          `).join("")}
        </div>
      `;
      area.appendChild(group);
    }

    if (!area.children.length) {
      area.innerHTML = `<p class="empty-state">這個篩選範圍沒有 ${TYPE_LABELS[ACTIVE_TYPE]} 資料。</p>`;
    }
  }

  function currentScopeItems() {
    const bookVal = document.getElementById("bookFilter").value;
    const lessonVal = document.getElementById("lessonFilter").value;
    return ALL_ITEMS.filter(item => (!bookVal || item._book === bookVal) && (!lessonVal || item._lesson === lessonVal));
  }

  function shuffle(items) {
    const copy = items.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function cleanSentence(sentence) {
    return String(sentence || "").replace(/\*/g, "");
  }

  function startPractice() {
    const pool = currentScopeItems();
    if (!pool.length) {
      alert("目前選擇的範圍沒有可練習的句子。");
      return;
    }
    const selectedBook = document.getElementById("bookFilter").value || "all";
    const selectedLesson = document.getElementById("lessonFilter").value || "all";
    PRACTICE = {
      questions: shuffle(pool).slice(0, 10), index: 0, correct: 0, score: 0,
      locked: false, startedAt: new Date(), wrongItems: [], book: selectedBook, lesson: selectedLesson, timer: null
    };
    document.getElementById("typeChooser").style.display = "none";
    document.getElementById("practiceLaunch").style.display = "none";
    document.getElementById("sentenceArea").style.display = "none";
    document.getElementById("practiceArea").style.display = "block";
    renderPracticeQuestion();
  }

  function renderPracticeQuestion() {
    const item = PRACTICE.questions[PRACTICE.index];
    const total = PRACTICE.questions.length;
    const area = document.getElementById("practiceArea");
    area.innerHTML = `
      <div class="practice-card">
        <div class="practice-hud"><span>第 ${PRACTICE.index + 1}／${total} 題</span><span>Score ${PRACTICE.score}</span><button class="practice-quit" id="quitPracticeBtn" type="button">離開挑戰</button></div>
        <div class="practice-progress"><span style="width:${PRACTICE.index / total * 100}%"></span></div>
        <div class="practice-question">${Loader.escapeHtml(cleanSentence(item.sentence))}</div>
        <div class="practice-options">
          ${TYPE_ORDER.map((type, i) => `<button class="practice-option" type="button" data-type="${type}"><span style="opacity:.55">${i + 1}.</span> ${TYPE_LABELS[type]}</button>`).join("")}
        </div>
        <div class="practice-feedback" id="practiceFeedback">選擇這句話的句型分類。</div>
      </div>`;
    area.querySelectorAll(".practice-option").forEach(button => button.addEventListener("click", () => answerPractice(button.dataset.type)));
    document.getElementById("quitPracticeBtn").addEventListener("click", exitPractice);
  }

  function answerPractice(answer) {
    if (PRACTICE.locked) return;
    PRACTICE.locked = true;
    const item = PRACTICE.questions[PRACTICE.index];
    const ok = answer === item.type;
    if (ok) {
      PRACTICE.correct++;
      PRACTICE.score += 15;
    } else {
      PRACTICE.wrongItems.push({sentence: cleanSentence(item.sentence), answer, correctType: item.type, book: item._book, lesson: item._lesson});
    }
    document.querySelectorAll("#practiceArea .practice-option").forEach(button => {
      button.disabled = true;
      if (button.dataset.type === item.type) button.classList.add("correct");
      else if (button.dataset.type === answer) button.classList.add("wrong");
    });
    document.getElementById("practiceFeedback").innerHTML = ok
      ? `<strong>答對了！＋15 分</strong><br>${Loader.escapeHtml(TYPE_LABELS[item.type])}`
      : `<strong>再看一次句子結構。</strong><br>正確答案：${Loader.escapeHtml(TYPE_LABELS[item.type])}`;
    PRACTICE.timer = setTimeout(() => {
      if (!PRACTICE) return;
      PRACTICE.index++;
      PRACTICE.locked = false;
      if (PRACTICE.index >= PRACTICE.questions.length) finishPractice();
      else renderPracticeQuestion();
    }, 1050);
  }

  function appendProgressHistory(record) {
    let history = [];
    try { const saved = JSON.parse(localStorage.getItem("learning.progress.history.v1") || "[]"); if (Array.isArray(saved)) history = saved; } catch (_) {}
    history.push(record);
    try { localStorage.setItem("learning.progress.history.v1", JSON.stringify(history.slice(-300))); }
    catch (_) { try { localStorage.setItem("learning.progress.history.v1", JSON.stringify(history.slice(-100))); } catch (_) {} }
  }

  function finishPractice() {
    const endedAt = new Date();
    const total = PRACTICE.questions.length;
    const accuracy = total ? Math.round(PRACTICE.correct / total * 100) : 0;
    appendProgressHistory({
      schemaVersion: 1,
      attemptId: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : `grammar-bank-${endedAt.getTime()}-${Math.random().toString(36).slice(2,8)}`,
      activity: "grammar-practice", source: "grammar-bank", mode: "sentence-classification", modeLabel: "句型分類挑戰",
      book: PRACTICE.book, lesson: PRACTICE.lesson, startedAt: PRACTICE.startedAt.toISOString(), endedAt: endedAt.toISOString(),
      durationSeconds: Math.max(0, Math.round((endedAt - PRACTICE.startedAt) / 1000)), endReason: "completed",
      scoreRule: "15-per-correct", pointsPerCorrect: 15, score: PRACTICE.score,
      correct: PRACTICE.correct, wrong: total - PRACTICE.correct, total, accuracy, wrongItems: PRACTICE.wrongItems
    });
    document.getElementById("practiceArea").innerHTML = `
      <div class="practice-card practice-result">
        <div class="trophy">${accuracy >= 90 ? "🏆" : accuracy >= 70 ? "⭐" : "💪"}</div>
        <h2>十句分類挑戰完成</h2>
        <div class="practice-result-grid">
          <div><strong>${PRACTICE.score}</strong><span>Score</span></div>
          <div><strong>${PRACTICE.correct}／${total}</strong><span>答對／總題</span></div>
          <div><strong>${accuracy}%</strong><span>正確率</span></div>
        </div>
        <div class="practice-actions">
          <button class="practice-action secondary" id="backToBankBtn" type="button">回句型列表</button>
          <button class="practice-action" id="practiceAgainBtn" type="button">再挑戰一次</button>
        </div>
      </div>`;
    document.getElementById("backToBankBtn").addEventListener("click", exitPractice);
    document.getElementById("practiceAgainBtn").addEventListener("click", startPractice);
  }

  function exitPractice() {
    if (PRACTICE?.timer) clearTimeout(PRACTICE.timer);
    PRACTICE = null;
    document.getElementById("practiceArea").style.display = "none";
    document.getElementById("practiceArea").innerHTML = "";
    document.getElementById("typeChooser").style.display = "grid";
    document.getElementById("practiceLaunch").style.display = "flex";
    document.getElementById("sentenceArea").style.display = "block";
    renderFiltered();
  }

  // 從 item.id（例如 "b1l1-s004"）取出編號，跟單課頁一致的規則
  function displayNo(item) {
    const match = /-s0*(\d+)$/.exec(item.id || "");
    return match ? match[1] : "?";
  }
</script>
