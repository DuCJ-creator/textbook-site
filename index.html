<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英文課程補充教材 · 線上互動版</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  /* ===== Header（品牌識別，與 lesson.html 一致） ===== */
  .site-head {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    padding: 44px 20px 36px;
    border-radius: 0 0 28px 28px;
  }
  .site-head .inner { max-width: 1040px; margin: 0 auto; }
  .site-head .brand-line {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,.72); margin-bottom: 14px;
  }
  .site-head .eyebrow {
    font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,.72); margin-bottom: 10px;
  }
  .site-head h1 {
    font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700;
    margin: 0 0 10px; letter-spacing: -0.01em; line-height: 1.15;
  }
  .site-head p { font-size: 0.92rem; color: rgba(255,255,255,.85); max-width: 560px; line-height: 1.6; margin: 0; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 20px 0; }

  /* ===== Progress strip ===== */
  .progress-strip {
    display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 32px;
    padding: 16px 20px; background: var(--card); border: 1px solid var(--paper-line); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .progress-strip .stat { display: flex; align-items: baseline; gap: 6px; }
  .progress-strip .stat .n { font-family: var(--serif); font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .progress-strip .stat .l { font-size: 0.78rem; color: var(--ink-soft); }

  /* ===== Section titles ===== */
  .section-title {
    font-family: var(--serif); font-size: 1.15rem; font-weight: 700;
    letter-spacing: 0.01em; margin: 0 0 14px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .section-title .rule { flex: 1; height: 1px; background: var(--paper-line); }

  /* ===== Book cards ===== */
  .book-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }

  .book-card {
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .book-head {
    display: flex; align-items: center; gap: 16px;
    width: 100%; text-align: left; border: none; background: none; cursor: pointer;
    padding: 16px 18px; font-family: var(--sans); color: var(--ink);
  }
  .book-head:hover { background: var(--accent-soft); }

  .book-num {
    font-family: var(--serif); font-size: 1.6rem; font-weight: 700;
    width: 44px; height: 44px; flex: 0 0 auto;
    border: 1px solid var(--paper-line); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent-dark);
  }

  .book-meta { flex: 1; min-width: 0; }
  .book-meta .title { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; margin-bottom: 3px; }
  .book-meta .sub { font-size: 0.78rem; color: var(--ink-soft); }

  .book-progress-bar {
    width: 90px; height: 6px; border-radius: 999px; background: var(--gold-soft); overflow: hidden; flex: 0 0 auto;
    display: none;
  }
  @media (min-width: 520px) { .book-progress-bar { display: block; } }
  .book-progress-bar .fill { height: 100%; background: var(--accent); border-radius: 999px; }

  .chevron {
    flex: 0 0 auto; font-size: 1rem; color: var(--ink-soft); transition: transform .18s ease;
  }
  .book-card.expanded .chevron { transform: rotate(90deg); }

  .lesson-list {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 8px;
    padding: 4px 18px 18px;
  }
  .book-card.expanded .lesson-list { display: grid; }

  .lesson-item {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid var(--paper-line); border-radius: 13px;
    padding: 10px 12px; background: var(--paper);
    transition: border-color .12s ease, background .12s ease, transform .12s ease;
  }
  .lesson-item:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }

  .lesson-item .l-num {
    font-family: var(--sans); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
    color: var(--ink-soft); text-transform: uppercase; margin-bottom: 2px;
  }
  .lesson-item .l-title { font-family: var(--serif); font-size: 0.95rem; line-height: 1.35; }

  .lesson-item.is-draft {
    background: #f0ede4; border-style: dashed;
  }
  .lesson-item.is-draft .l-title { color: #a89e8e; font-style: italic; }
  .lesson-item.is-draft:hover { border-color: #a89e8e; background: #f0ede4; transform: none; }
  .lesson-item.is-draft .l-num::after { content: " · 尚未上架"; color: #a89e8e; font-style: normal; }

  /* ===== Cross-lesson tools ===== */
  .tool-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 40px;
  }
  .tool-card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--accent); border-radius: var(--radius);
    padding: 16px 18px; position: relative; box-shadow: var(--shadow);
    transition: transform .15s ease;
  }
  .tool-card:hover { transform: translateY(-2px); }
  .tool-card .t-title { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; color: var(--accent-dark); }
  .tool-card .t-desc { font-size: 0.8rem; color: var(--ink-soft); }
  .tool-card .badge {
    position: absolute; top: 14px; right: 14px;
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--blue-soft); color: var(--accent-dark); padding: 3px 8px; border-radius: 999px;
  }

  footer.site-foot {
    max-width: 1040px; margin: 0 auto; padding: 20px 20px 0;
    font-size: 0.74rem; color: var(--ink-soft); border-top: 1px solid var(--paper-line);
  }

  @media (max-width: 560px) {
    .book-head { gap: 12px; padding: 14px; }
    .book-num { width: 38px; height: 38px; font-size: 1.3rem; }
  }
</style>
</head>
<body>

  <div class="site-head">
    <div class="inner">
      <div class="brand-line">🍃 Tr. Shirley Du's High School English Course · Textbook Supplements Online</div>
      <div class="eyebrow">Comprehensive English Course · Online Companion</div>
      <h1>英文課程補充教材</h1>
      <p>紙本教材的線上互動延伸——單字家族探索、片語自我測驗、句型分類練習，一站補齊課堂講義沒印出來的內容。</p>
    </div>
  </div>

  <div class="wrap">

    <div class="progress-strip" id="progressStrip"></div>

    <div class="section-title"><span>選擇冊次</span><span class="rule"></span></div>
    <div class="book-list" id="bookList">
      <div style="padding:20px; color:var(--ink-soft); font-size:0.85rem;">課程清單載入中…</div>
    </div>

    <div class="section-title"><span>跨課總覽工具</span><span class="rule"></span></div>
    <div class="tool-grid" id="toolGrid"></div>

  </div>

  <footer class="site-foot">
    Prepared by Shirley Du@CHHS
  </footer>

<script>
  const INDEX_URL = "data/index.json";

  fetch(INDEX_URL)
    .then(res => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(data => {
      renderProgress(data);
      renderBooks(data);
      renderTools(data);
    })
    .catch(err => {
      document.getElementById("bookList").innerHTML =
        `<div style="padding:20px; color:var(--accent); font-size:0.85rem;">
          課程清單載入失敗：${escapeHtml(err.message)}（請確認此頁面透過本機伺服器或 GitHub Pages 開啟，而非直接雙擊開啟檔案）
        </div>`;
    });

  function escapeHtml(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function renderProgress(data) {
    const allLessons = data.books.flatMap(b => b.lessons);
    const published = allLessons.filter(l => l.status === "published").length;
    const total = allLessons.length;

    const strip = document.getElementById("progressStrip");
    strip.innerHTML = `
      <div class="stat"><span class="n">${data.books.length}</span><span class="l">冊</span></div>
      <div class="stat"><span class="n">${total}</span><span class="l">課總數</span></div>
      <div class="stat"><span class="n">${published}</span><span class="l">已上架</span></div>
    `;
  }

  function renderBooks(data) {
    const wrap = document.getElementById("bookList");
    wrap.innerHTML = "";

    data.books.forEach(book => {
      const publishedCount = book.lessons.filter(l => l.status === "published").length;
      const total = book.lessons.length;
      const pct = total ? Math.round((publishedCount / total) * 100) : 0;

      const card = document.createElement("div");
      card.className = "book-card";

      const head = document.createElement("button");
      head.type = "button";
      head.className = "book-head";
      head.innerHTML = `
        <span class="book-num">${book.id.replace("b", "")}</span>
        <span class="book-meta">
          <span class="title">${escapeHtml(book.title)}</span>
          <span class="sub">共 ${total} 課 · 已上架 ${publishedCount} 課</span>
        </span>
        <span class="book-progress-bar"><span class="fill" style="width:${pct}%"></span></span>
        <span class="chevron">▸</span>
      `;
      head.addEventListener("click", () => card.classList.toggle("expanded"));

      const list = document.createElement("div");
      list.className = "lesson-list";
      book.lessons.forEach((lesson, i) => {
        const isPublished = lesson.status === "published";
        const displayTitle = isPublished ? lesson.title : "尚未上架";
        const href = isPublished
          ? `lesson.html?book=${book.id}&lesson=${lesson.id}`
          : `coming-soon.html?book=${book.id}&lesson=${lesson.id}`;

        const a = document.createElement("a");
        a.className = "lesson-item" + (isPublished ? "" : " is-draft");
        a.href = href;
        a.innerHTML = `
          <div class="l-num">${book.id.toUpperCase()} ${lesson.id.toUpperCase()}</div>
          <div class="l-title">${escapeHtml(displayTitle)}</div>
        `;
        list.appendChild(a);
      });

      card.appendChild(head);
      card.appendChild(list);
      wrap.appendChild(card);
    });

    // 預設展開第一個有已發布課程的冊次，方便使用者立即看到內容
    const firstWithPublished = data.books.findIndex(b => b.lessons.some(l => l.status === "published"));
    const target = wrap.children[firstWithPublished >= 0 ? firstWithPublished : 0];
    if (target) target.classList.add("expanded");
  }

  function renderTools(data) {
    const wrap = document.getElementById("toolGrid");
    wrap.innerHTML = "";
    data.cross_lesson_tools.forEach(tool => {
      const comingSoon = tool.status === "coming_soon";
      const a = document.createElement("a");
      a.className = "tool-card";
      a.href = comingSoon ? "#" : `${tool.id}.html`;
      if (comingSoon) {
        a.addEventListener("click", e => e.preventDefault());
      }
      a.innerHTML = `
        ${comingSoon ? '<span class="badge">即將推出</span>' : ""}
        <div class="t-title">${escapeHtml(tool.title)}</div>
        <div class="t-desc">${comingSoon ? "彙整所有已上架課程的內容，正在製作中。" : "點擊瀏覽"}</div>
      `;
      wrap.appendChild(a);
    });
  }
</script>
</body>
</html>
